global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mesa-gateway
    static_configs:
      - targets: ['gateway:9464']

  - job_name: mesa-api
    static_configs:
      - targets: ['api:9465']

  - job_name: mesa-worker
    static_configs:
      - targets: ['worker:9466']

  - job_name: mesa-postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: mesa-redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: mesa-node
    static_configs:
      - targets: ['172.18.0.1:9100']
