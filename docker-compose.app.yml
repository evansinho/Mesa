services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mesa
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: mesa
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mesa']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ['-js', '-m', '8222']
    ports:
      - '4222:4222'
      - '8222:8222'

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mesa:mesa@postgres:5432/mesa
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
    ports:
      - '3001:3001'
    depends_on:
      - postgres
      - redis
      - nats

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mesa:mesa@postgres:5432/mesa
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
    ports:
      - '3002:3002'
    depends_on:
      - postgres
      - redis
      - nats

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mesa:mesa@postgres:5432/mesa
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
    ports:
      - '3003:3003'
    depends_on:
      - postgres
      - redis
      - nats

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    env_file: .env
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
