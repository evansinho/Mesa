services:
  metabase:
    image: metabase/metabase:latest
    container_name: mesa-metabase
    restart: unless-stopped
    ports:
      - '3100:3000'
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      # Optional: set a secret key for embedding (generate with: openssl rand -hex 32)
      MB_EMBEDDING_SECRET_KEY: ${METABASE_SECRET_KEY:-changeme}
      JAVA_OPTS: -Xmx512m
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  metabase_data:
