name: deploy

# Only one deploy at a time. Merging two PRs in quick succession started two
# runs in the same minute, both SSHing into the same host and both running
# `docker compose up` — they raced, and the second one's prune collided with
# the first one's. Queue rather than cancel: an in-flight deploy is midway
# through recreating containers and killing it leaves the box half-updated.
concurrency:
  group: deploy-production
  cancel-in-progress: false

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          tags: ghcr.io/evansinho/mesa-gateway:latest
          provenance: false

      - name: Build and push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/evansinho/mesa-api:latest
          provenance: false

      - name: Build and push worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ghcr.io/evansinho/mesa-worker:latest
          provenance: false

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /opt/mesa
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose -f docker-compose.metabase.yml up -d
            # Cleanup only, and it is allowed to fail. A concurrent prune makes
            # this exit 1, which used to mark a completely successful deploy as
            # failed — and a red deploy that actually worked teaches everyone to
            # ignore red deploys, so the next real failure looks identical.
            docker image prune -f || true
